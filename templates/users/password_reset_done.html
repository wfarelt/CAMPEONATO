{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Correo enviado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Lexend", sans-serif;
        background: #101622;
      }

      .status-card {
        width: min(100%, 28rem);
        background: #1c1f27;
        border-color: #282e39 !important;
      }

      .status-icon {
        width: 3.5rem;
        height: 3.5rem;
      }
    </style>
  </head>
  <body class="text-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <section class="status-card border rounded-3 p-4 p-sm-5 text-center" aria-labelledby="status-title">
        <img
          src="{% static 'tournament/img/futbolscz_logo.png' %}"
          alt="FutbolSCZ"
          class="rounded-3 object-fit-cover mb-4"
          width="80"
          height="80"
        />
        <div class="d-flex justify-content-center mb-3">
          <div class="status-icon rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center">
            <i class="bi bi-envelope-check fs-4" aria-hidden="true"></i>
          </div>
        </div>
        <h1 class="h3 fw-bold mb-2" id="status-title">Revisa tu correo</h1>
        <p class="text-white-50 mb-4">
          Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña en los próximos minutos.
          Revisa también tu carpeta de spam.
        </p>
        <a href="{% url 'login' %}" class="btn btn-success w-100">Volver al login</a>
      </section>
    </main>
  </body>
</html>
